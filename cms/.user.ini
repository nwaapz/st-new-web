; Raise upload limits for CMS image uploads (images are optimized server-side after upload).
; Read by PHP-FPM/FastCGI hosts (e.g. cPanel). mod_php reads the .htaccess php_value block instead.
upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
